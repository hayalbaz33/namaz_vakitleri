<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namaz Vakti TV</title>

  <style>
    :root {
      --bg-1: #fbf7ef;
      --bg-2: #f1e7d6;
      --card: rgba(255, 255, 255, 0.72);
      --card-strong: rgba(255, 255, 255, 0.88);
      --text: #2f241b;
      --muted: #7b6a58;
      --accent: #b08a57;
      --accent-soft: #e9dbc4;
      --line: rgba(176, 138, 87, 0.18);
      --shadow: 0 20px 60px rgba(86, 61, 28, 0.12);

      --warning-bg-1: #fff6ef;
      --warning-bg-2: #f8dfd2;
      --warning-accent: #c4644b;
      --warning-soft: #f6e0d7;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.95), transparent 28%),
        radial-gradient(circle at top right, rgba(255,255,255,0.55), transparent 22%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      transition: background 0.5s ease;
    }

    body.warning {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.95), transparent 28%),
        radial-gradient(circle at top right, rgba(255,255,255,0.45), transparent 22%),
        linear-gradient(135deg, var(--warning-bg-1), var(--warning-bg-2));
    }

    .screen {
      width: 100%;
      height: 100%;
      padding: 34px 38px 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand {
      font-size: clamp(18px, 1.4vw, 28px);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .location {
      font-size: clamp(20px, 1.9vw, 34px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    .clock-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .date {
      font-size: clamp(16px, 1.2vw, 24px);
      color: var(--muted);
      font-weight: 600;
    }

    .top-clock {
      font-size: clamp(36px, 3.8vw, 64px);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .main-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .main-panel {
      width: min(1180px, 100%);
      border-radius: 34px;
      padding: 42px 46px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .main-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.28) 0%,
        rgba(255,255,255,0.02) 100%
      );
      pointer-events: none;
    }

    .mini-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: clamp(16px, 1.2vw, 22px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    body.warning .mini-label {
      background: var(--warning-soft);
      color: var(--warning-accent);
    }

    .prayer-name {
      position: relative;
      z-index: 1;
      font-size: clamp(54px, 6vw, 110px);
      font-weight: 900;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      color: var(--text);
    }

    .countdown {
      position: relative;
      z-index: 1;
      font-size: clamp(96px, 14vw, 220px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--accent);
      margin-bottom: 18px;
    }

    body.warning .countdown {
      color: var(--warning-accent);
    }

    .sub {
      position: relative;
      z-index: 1;
      font-size: clamp(22px, 2vw, 36px);
      font-weight: 700;
      color: var(--muted);
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .times-card {
      background: var(--card-strong);
      border: 1px solid rgba(255,255,255,0.62);
      box-shadow: var(--shadow);
      border-radius: 28px;
      padding: 18px;
      backdrop-filter: blur(12px);
    }

    .times {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .time-item {
      border-radius: 22px;
      padding: 18px 10px;
      background: rgba(255,255,255,0.52);
      border: 1px solid var(--line);
      text-align: center;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .time-name {
      font-size: clamp(18px, 1.4vw, 24px);
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .time-value {
      font-size: clamp(24px, 2vw, 36px);
      font-weight: 900;
      color: var(--text);
    }

    .time-item.active {
      background: linear-gradient(180deg, #fff7ea, #f3e2c6);
      border-color: rgba(176, 138, 87, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(176, 138, 87, 0.12);
    }

    body.warning .time-item.active {
      background: linear-gradient(180deg, #fff4ef, #f7dfd5);
      border-color: rgba(196, 100, 75, 0.30);
      box-shadow: 0 10px 26px rgba(196, 100, 75, 0.12);
    }

    .error-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .error {
      max-width: 920px;
      text-align: center;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 30px;
      padding: 36px;
      font-size: 30px;
      line-height: 1.5;
      box-shadow: var(--shadow);
      color: var(--text);
    }

    @media (max-width: 980px) {
      .screen {
        padding: 20px;
      }

      .main-panel {
        padding: 30px 24px;
        border-radius: 26px;
      }

      .times {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">Hayalhanem</div>
        <div class="location" id="location">MERSİN MERKEZ</div>
      </div>

      <div class="clock-wrap">
        <div class="date" id="dateText">--</div>
        <div class="top-clock" id="clock">--:--</div>
      </div>
    </header>

    <section class="main-card">
      <div class="main-panel">
        <div class="mini-label" id="label">Sıradaki Vakit</div>
        <div class="prayer-name" id="prayerName">YÜKLENİYOR</div>
        <div class="countdown" id="countdown">--:--</div>
        <div class="sub" id="subText">Namaz vakitleri alınıyor...</div>
      </div>
    </section>

    <section class="bottom">
      <div class="times-card">
        <div class="times" id="times"></div>
      </div>
    </section>
  </main>

  <script>
    // =========================
    // AYARLAR
    // =========================
    const LOCATION_LABEL = "MERSİN MERKEZ";
    const LATITUDE = 36.8121;
    const LONGITUDE = 34.6415;
    const METHOD = 13; // Diyanet/Türkiye
    const WARNING_MINUTES = 10;

    const PRAYERS = [
      { key: "Fajr", name: "SABAH" },
      { key: "Dhuhr", name: "ÖĞLE" },
      { key: "Asr", name: "İKİNDİ" },
      { key: "Maghrib", name: "AKŞAM" },
      { key: "Isha", name: "YATSI" }
    ];

    let prayerSchedule = [];

    const locationEl = document.getElementById("location");
    const dateTextEl = document.getElementById("dateText");
    const clockEl = document.getElementById("clock");
    const labelEl = document.getElementById("label");
    const prayerNameEl = document.getElementById("prayerName");
    const countdownEl = document.getElementById("countdown");
    const subTextEl = document.getElementById("subText");
    const timesEl = document.getElementById("times");

    locationEl.textContent = LOCATION_LABEL;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function formatDateForApi(date) {
      return `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()}`;
    }

    function cleanTime(timeText) {
      return timeText.replace(/[^\d:]/g, "").slice(0, 5);
    }

    function makeDateFromTime(baseDate, timeText) {
      const [hour, minute] = cleanTime(timeText).split(":").map(Number);
      return new Date(
        baseDate.getFullYear(),
        baseDate.getMonth(),
        baseDate.getDate(),
        hour,
        minute,
        0
      );
    }

    function formatTurkishDate(date) {
      return new Intl.DateTimeFormat("tr-TR", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(date);
    }

    async function fetchTimings(date) {
      const apiDate = formatDateForApi(date);
      const url =
        `https://api.aladhan.com/v1/timings/${apiDate}` +
        `?latitude=${LATITUDE}` +
        `&longitude=${LONGITUDE}` +
        `&method=${METHOD}`;

      const res = await fetch(url);
      const json = await res.json();

      if (!json || json.code !== 200) {
        throw new Error("Namaz vakitleri alınamadı.");
      }

      return json.data.timings;
    }

    async function loadPrayerTimes() {
      try {
        const today = new Date();
        const tomorrow = new Date();
        tomorrow.setDate(today.getDate() + 1);

        dateTextEl.textContent = formatTurkishDate(today);

        const todayTimings = await fetchTimings(today);
        const tomorrowTimings = await fetchTimings(tomorrow);

        prayerSchedule = [];

        PRAYERS.forEach(p => {
          prayerSchedule.push({
            key: p.key,
            name: p.name,
            time: cleanTime(todayTimings[p.key]),
            date: makeDateFromTime(today, todayTimings[p.key])
          });
        });

        PRAYERS.forEach(p => {
          prayerSchedule.push({
            key: p.key,
            name: p.name,
            time: cleanTime(tomorrowTimings[p.key]),
            date: makeDateFromTime(tomorrow, tomorrowTimings[p.key])
          });
        });

        renderTodayTimes(todayTimings);
        updateScreen();

      } catch (err) {
        document.body.innerHTML = `
          <div class="error-wrap">
            <div class="error">
              Namaz vakitleri alınamadı.<br>
              İnternet bağlantısını kontrol et.
            </div>
          </div>
        `;
      }
    }

    function renderTodayTimes(timings) {
      const next = getNextPrayer();

      timesEl.innerHTML = PRAYERS.map(p => {
        const isActive = next && next.name === p.name;
        return `
          <div class="time-item ${isActive ? "active" : ""}">
            <div class="time-name">${p.name}</div>
            <div class="time-value">${cleanTime(timings[p.key])}</div>
          </div>
        `;
      }).join("");
    }

    function getNextPrayer() {
      const now = new Date();
      return prayerSchedule.find(p => p.date > now);
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (hours > 0) {
        return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      }

      return `${pad(minutes)}:${pad(seconds)}`;
    }

    function updateClock() {
      const now = new Date();
      clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      dateTextEl.textContent = formatTurkishDate(now);
    }

    function updateScreen() {
      updateClock();

      const next = getNextPrayer();
      if (!next) return;

      const now = new Date();
      const diffMs = next.date - now;
      const diffMinutes = diffMs / 1000 / 60;
      const isWarning = diffMinutes <= WARNING_MINUTES;

      document.body.classList.toggle("warning", isWarning);

      labelEl.textContent = isWarning ? "Namaza Hazırlık" : "Sıradaki Vakit";
      prayerNameEl.textContent = next.name;
      countdownEl.textContent = formatCountdown(diffMs);

      if (isWarning) {
        subTextEl.textContent = `${next.time} • Son ${Math.ceil(diffMinutes)} dakika`;
      } else {
        subTextEl.textContent = `${next.time} vaktine kalan süre`;
      }

      // Alt saat kartlarını yenile (aktif vakit vurgusu güncellensin)
      const today = new Date();
      fetchTimings(today).then(renderTodayTimes).catch(() => {});
    }

    async function keepScreenAwake() {
      try {
        if ("wakeLock" in navigator) {
          await navigator.wakeLock.request("screen");
        }
      } catch (e) {}
    }

    loadPrayerTimes();
    keepScreenAwake();

    setInterval(updateScreen, 1000);

    setInterval(() => {
      const now = new Date();
      if (now.getHours() === 0 && now.getMinutes() === 5) {
        loadPrayerTimes();
      }
    }, 60 * 1000);
  </script>
</body>
</html>
