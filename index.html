<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Namaz Vakti TV" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.json" />

  <title>Namaz Vakti TV</title>

  <link rel="stylesheet" href="./style.css?v=34" />
</head>

<body class="tv-root">
  <main class="screen tv-stage" id="appScreen">
    <div class="stars"></div>
    <div class="noise"></div>
    <div class="vignette"></div>
    
    <div class="warningVideoLayer" id="warningVideoLayer" aria-hidden="true">
      <video
        id="impactVideo"
        class="warningVideo warningImpactVideo"
        src="./assets/warning-impact.mp4"
        preload="auto"
        muted
        playsinline
      ></video>

      <video
        id="loopVideo"
        class="warningVideo warningLoopVideo"
        src="./assets/warning-loop.mp4"
        preload="auto"
        muted
        playsinline
        loop
      ></video>
    </div>
    <button class="testModeButton hide-in-presentation" id="testModeButton" type="button">Test 05:30</button>
    <button class="presentationModeButton hide-in-presentation" id="presentationModeButton" type="button">TV / Sunum Modu</button>
    <button class="presentationExitButton" id="presentationExitButton" type="button" aria-label="Sunum modundan çık">Çıkış</button>

    <section class="topbar">
      <div class="city" id="cityName">Mersin Merkez</div>

      <div class="clockBox">
        <div class="date" id="todayText">Yükleniyor...</div>
        <div class="clock" id="clockText">--:--</div>
      </div>
    </section>

    <section class="hero">
      <div class="planet"></div>

      <div class="heroContent">
        <div class="smallTitle">SIRADAKİ VAKİT</div>
        <h1 id="nextPrayerName">---</h1>

        <div class="countdownBox">
          <span id="countdownText">00:00:00</span>
        </div>
      </div>
    </section>

    <section class="times">
      <div class="sectionTitle">
        <span></span>
        <p>BUGÜNÜN VAKİTLERİ</p>
        <span></span>
      </div>

      <div class="cards">
        <div class="timeCard" data-prayer="Fajr">
          <div>İMSAK</div>
          <strong id="timeFajr">--:--</strong>
        </div>

        <div class="timeCard" data-prayer="Sunrise">
          <div>GÜNEŞ</div>
          <strong id="timeSunrise">--:--</strong>
        </div>

        <div class="timeCard" data-prayer="Dhuhr">
          <div>ÖĞLE</div>
          <strong id="timeDhuhr">--:--</strong>
        </div>

        <div class="timeCard" data-prayer="Asr">
          <div>İKİNDİ</div>
          <strong id="timeAsr">--:--</strong>
        </div>

        <div class="timeCard" data-prayer="Maghrib">
          <div>AKŞAM</div>
          <strong id="timeMaghrib">--:--</strong>
        </div>

        <div class="timeCard" data-prayer="Isha">
          <div>YATSI</div>
          <strong id="timeIsha">--:--</strong>
        </div>
      </div>
    </section>

    <footer>
      <span id="statusText">Vakitler hazırlanıyor...</span>
    </footer>
  </main>

  <audio id="warningSound" src="./assets/beep.mp3" preload="auto"></audio>
  <script src="./script.js?v=34"></script>
  <script src="./test-mode.js?v=34"></script>
</body>
</html>
