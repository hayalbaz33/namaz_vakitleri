<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namaz Vakti TV</title>

  <style>
    :root {
      --bg-1: #eef0f3;
      --bg-2: #dfe3e8;
      --bg-3: #f8f9fb;

      --text: #252b33;
      --text-soft: #59616c;
      --muted: #7a828d;

      --panel: rgba(255, 255, 255, 0.58);
      --panel-strong: rgba(255, 255, 255, 0.76);
      --panel-border: rgba(255, 255, 255, 0.82);

      --active-1: #7d8794;
      --active-2: #515b68;

      --shadow-soft: 0 28px 80px rgba(35, 43, 54, 0.13);
      --shadow-card: 0 16px 46px rgba(35, 43, 54, 0.12);

      --warning-1: #f2e9e6;
      --warning-2: #dcc9c3;
      --warning-accent: #8f4e43;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 22% 14%, rgba(255,255,255,0.95), transparent 24%),
        radial-gradient(circle at 80% 4%, rgba(255,255,255,0.72), transparent 24%),
        linear-gradient(145deg, var(--bg-3), var(--bg-1) 42%, var(--bg-2));
      transition: background 0.5s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      left: -10vw;
      right: -10vw;
      height: 38vh;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: 30vh;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.42),
        rgba(255,255,255,0.08)
      );
      transform: rotate(-7deg);
      filter: blur(0.2px);
    }

    body::after {
      top: 48vh;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.32),
        rgba(255,255,255,0.04)
      );
      transform: rotate(-4deg);
    }

    body.warning {
      background:
        radial-gradient(circle at 22% 14%, rgba(255,255,255,0.88), transparent 24%),
        radial-gradient(circle at 80% 4%, rgba(255,255,255,0.55), transparent 24%),
        linear-gradient(145deg, #faf7f5, var(--warning-1) 45%, var(--warning-2));
    }

    .screen {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: clamp(28px, 3vw, 54px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(22px, 2.4vw, 42px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 28px;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }

    .brand {
      font-size: clamp(24px, 2vw, 40px);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #252b33;
      text-transform: uppercase;
      line-height: 1;
    }

    .location {
      font-size: clamp(22px, 1.75vw, 36px);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-soft);
      line-height: 1.1;
    }

    .clock-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .date {
      font-size: clamp(17px, 1.25vw, 28px);
      color: var(--text-soft);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .top-clock {
      font-size: clamp(58px, 5.2vw, 112px);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.86;
      color: #30353d;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.88),
        0 16px 34px rgba(31,37,45,0.14);
    }

    .main-card {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-panel {
      width: min(1060px, 72vw);
      min-height: clamp(330px, 42vh, 520px);
      border-radius: clamp(36px, 3vw, 58px);
      padding: clamp(34px, 3.2vw, 58px);
      background:
        linear-gradient(145deg, rgba(255,255,255,0.82), rgba(244,246,248,0.64));
      border: 1px solid var(--panel-border);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.95),
        inset 0 -1px 0 rgba(120,130,145,0.12),
        var(--shadow-soft);
      backdrop-filter: blur(20px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .main-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.75), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,0.20), transparent);
      pointer-events: none;
    }

    .mini-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 30px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.84), rgba(221,226,232,0.72));
      border: 1px solid rgba(135,145,158,0.18);
      color: #303742;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 8px 22px rgba(38,44,54,0.10);
      font-size: clamp(15px, 1.15vw, 24px);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: clamp(18px, 2vw, 34px);
    }

    body.warning .mini-label {
      color: var(--warning-accent);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.86), rgba(237,220,214,0.70));
    }

    .prayer-name {
      position: relative;
      z-index: 1;
      font-size: clamp(64px, 6.7vw, 128px);
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 0.92;
      margin: 0 0 clamp(22px, 2.5vw, 42px);
      color: #27303a;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.78),
        0 18px 34px rgba(31,37,45,0.12);
    }

    .countdown {
      position: relative;
      z-index: 1;
      font-size: clamp(112px, 13vw, 250px);
      line-height: 0.78;
      font-weight: 300;
      letter-spacing: -0.075em;
      color: #323943;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.82),
        0 22px 44px rgba(31,37,45,0.18);
      margin-bottom: clamp(28px, 2.7vw, 46px);
      font-variant-numeric: tabular-nums;
    }

    body.warning .countdown {
      color: var(--warning-accent);
    }

    .sub {
      position: relative;
      z-index: 1;
      font-size: clamp(22px, 1.95vw, 38px);
      font-weight: 500;
      color: var(--text-soft);
      letter-spacing: -0.02em;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr;
    }

    .times {
      width: min(1700px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(18px, 1.6vw, 34px);
    }

    .time-item {
      min-height: clamp(128px, 14vh, 210px);
      border-radius: clamp(24px, 2vw, 38px);
      padding: clamp(18px, 1.6vw, 30px) 16px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.72), rgba(235,238,242,0.54));
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -1px 0 rgba(120,130,145,0.10),
        var(--shadow-card);
      backdrop-filter: blur(16px);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(8px, 0.8vw, 14px);
      position: relative;
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    }

    .time-item::before {
      content: "";
      width: clamp(46px, 3.6vw, 68px);
      height: clamp(46px, 3.6vw, 68px);
      margin: 0 auto 4px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,0.95), rgba(224,228,233,0.75));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 10px 24px rgba(45,52,62,0.09);
    }

    .time-item::after {
      content: "";
      position: absolute;
      top: clamp(32px, 3vw, 56px);
      left: 50%;
      width: clamp(20px, 1.6vw, 30px);
      height: clamp(20px, 1.6vw, 30px);
      transform: translateX(-50%);
      border-radius: 50%;
      border: 2px solid rgba(48,55,66,0.55);
      box-shadow: 0 0 0 8px rgba(255,255,255,0.22);
      opacity: 0.75;
    }

    .time-name {
      position: relative;
      z-index: 1;
      font-size: clamp(18px, 1.35vw, 28px);
      font-weight: 800;
      color: #606873;
      letter-spacing: 0.10em;
    }

    .time-value {
      position: relative;
      z-index: 1;
      font-size: clamp(32px, 2.8vw, 56px);
      font-weight: 700;
      color: #2d333c;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }

    .time-item.active {
      transform: translateY(-6px);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.42), transparent 38%),
        linear-gradient(145deg, var(--active-1), var(--active-2));
      border-color: rgba(255,255,255,0.85);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.48),
        inset 0 -1px 0 rgba(0,0,0,0.16),
        0 0 0 1px rgba(255,255,255,0.22),
        0 22px 58px rgba(46,55,66,0.24);
    }

    .time-item.active::before {
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,0.70), rgba(178,187,198,0.46));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.55),
        0 10px 24px rgba(0,0,0,0.14);
    }

    .time-item.active::after {
      border-color: rgba(255,255,255,0.72);
      box-shadow: 0 0 0 9px rgba(255,255,255,0.10);
    }

    .time-item.active .time-name,
    .time-item.active .time-value {
      color: #ffffff;
      text-shadow: 0 8px 20px rgba(0,0,0,0.20);
    }

    body.warning .time-item.active {
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.36), transparent 38%),
        linear-gradient(145deg, #a96b61, #81483f);
    }

    .error-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .error {
      max-width: 920px;
      text-align: center;
      background: rgba(255,255,255,0.74);
      border: 1px solid rgba(255,255,255,0.78);
      border-radius: 34px;
      padding: 38px;
      font-size: 30px;
      line-height: 1.5;
      box-shadow: var(--shadow-soft);
      color: var(--text);
    }

    @media (max-width: 980px) {
      .screen {
        padding: 22px;
        gap: 20px;
      }

      .main-panel {
        width: 100%;
        min-height: 310px;
        padding: 30px 22px;
      }

      .times {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .time-item {
        min-height: 120px;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">HAYALHANEM</div>
        <div class="location" id="location">MERSİN MERKEZ</div>
      </div>

      <div class="clock-wrap">
        <div class="date" id="dateText">--</div>
        <div class="top-clock" id="clock">--:--</div>
      </div>
    </header>

    <section class="main-card">
      <div class="main-panel">
        <div class="mini-label" id="label">SIRADAKİ VAKİT</div>
        <div class="prayer-name" id="prayerName">YÜKLENİYOR</div>
        <div class="countdown" id="countdown">--:--</div>
        <div class="sub" id="subText">Namaz vakitleri alınıyor...</div>
      </div>
    </section>

    <section class="bottom">
      <div class="times" id="times"></div>
    </section>
  </main>

  <script>
    // =========================
    // AYARLAR
    // =========================
    const LOCATION_LABEL = "MERSİN MERKEZ";
    const LATITUDE = 36.8121;
    const LONGITUDE = 34.6415;

    // AlAdhan: Diyanet İşleri Başkanlığı, Turkey
    const METHOD = 13;

    // Namaza son kaç dakika kala hazırlık rengi aktif olsun?
    const WARNING_MINUTES = 10;

    const PRAYERS = [
      { key: "Fajr", name: "SABAH" },
      { key: "Dhuhr", name: "ÖĞLE" },
      { key: "Asr", name: "İKİNDİ" },
      { key: "Maghrib", name: "AKŞAM" },
      { key: "Isha", name: "YATSI" }
    ];

    let prayerSchedule = [];
    let todayTimingsCache = null;
    let lastRenderedActiveName = null;

    const locationEl = document.getElementById("location");
    const dateTextEl = document.getElementById("dateText");
    const clockEl = document.getElementById("clock");
    const labelEl = document.getElementById("label");
    const prayerNameEl = document.getElementById("prayerName");
    const countdownEl = document.getElementById("countdown");
    const subTextEl = document.getElementById("subText");
    const timesEl = document.getElementById("times");

    locationEl.textContent = LOCATION_LABEL;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function formatDateForApi(date) {
      return `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()}`;
    }

    function cleanTime(timeText) {
      return timeText.replace(/[^\d:]/g, "").slice(0, 5);
    }

    function makeDateFromTime(baseDate, timeText) {
      const [hour, minute] = cleanTime(timeText).split(":").map(Number);

      return new Date(
        baseDate.getFullYear(),
        baseDate.getMonth(),
        baseDate.getDate(),
        hour,
        minute,
        0
      );
    }

    function formatTurkishDate(date) {
      const parts = new Intl.DateTimeFormat("tr-TR", {
        day: "numeric",
        month: "long",
        weekday: "long"
      }).formatToParts(date);

      const day = parts.find(p => p.type === "day")?.value || "";
      const month = parts.find(p => p.type === "month")?.value || "";
      const weekday = parts.find(p => p.type === "weekday")?.value || "";

      return `${day} ${month} ${weekday}`;
    }

    async function fetchTimings(date) {
      const apiDate = formatDateForApi(date);

      const url =
        `https://api.aladhan.com/v1/timings/${apiDate}` +
        `?latitude=${LATITUDE}` +
        `&longitude=${LONGITUDE}` +
        `&method=${METHOD}`;

      const res = await fetch(url);
      const json = await res.json();

      if (!json || json.code !== 200) {
        throw new Error("Namaz vakitleri alınamadı.");
      }

      return json.data.timings;
    }

    async function loadPrayerTimes() {
      try {
        const today = new Date();
        const tomorrow = new Date();
        tomorrow.setDate(today.getDate() + 1);

        dateTextEl.textContent = formatTurkishDate(today);

        const todayTimings = await fetchTimings(today);
        const tomorrowTimings = await fetchTimings(tomorrow);

        todayTimingsCache = todayTimings;
        prayerSchedule = [];

        PRAYERS.forEach(p => {
          prayerSchedule.push({
            key: p.key,
            name: p.name,
            time: cleanTime(todayTimings[p.key]),
            date: makeDateFromTime(today, todayTimings[p.key])
          });
        });

        PRAYERS.forEach(p => {
          prayerSchedule.push({
            key: p.key,
            name: p.name,
            time: cleanTime(tomorrowTimings[p.key]),
            date: makeDateFromTime(tomorrow, tomorrowTimings[p.key])
          });
        });

        renderTodayTimes();
        updateScreen();

      } catch (err) {
        document.body.innerHTML = `
          <div class="error-wrap">
            <div class="error">
              Namaz vakitleri alınamadı.<br>
              İnternet bağlantısını kontrol et.
            </div>
          </div>
        `;
      }
    }

    function getNextPrayer() {
      const now = new Date();
      return prayerSchedule.find(p => p.date > now);
    }

    function renderTodayTimes() {
      if (!todayTimingsCache) return;

      const next = getNextPrayer();
      const activeName = next ? next.name : "";

      lastRenderedActiveName = activeName;

      timesEl.innerHTML = PRAYERS.map(p => {
        const isActive = activeName === p.name;

        return `
          <div class="time-item ${isActive ? "active" : ""}">
            <div class="time-name">${p.name}</div>
            <div class="time-value">${cleanTime(todayTimingsCache[p.key])}</div>
          </div>
        `;
      }).join("");
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (hours > 0) {
        return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      }

      return `${pad(minutes)}:${pad(seconds)}`;
    }

    function updateClock() {
      const now = new Date();

      clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      dateTextEl.textContent = formatTurkishDate(now);
    }

    function updateScreen() {
      updateClock();

      const next = getNextPrayer();

      if (!next) {
        return;
      }

      const now = new Date();
      const diffMs = next.date - now;
      const diffMinutes = diffMs / 1000 / 60;
      const isWarning = diffMinutes <= WARNING_MINUTES;

      document.body.classList.toggle("warning", isWarning);

      labelEl.textContent = isWarning ? "NAMAZA HAZIRLIK" : "SIRADAKİ VAKİT";
      prayerNameEl.textContent = next.name;
      countdownEl.textContent = formatCountdown(diffMs);

      if (isWarning) {
        subTextEl.textContent = `${next.time} • son ${Math.ceil(diffMinutes)} dakika`;
      } else {
        subTextEl.textContent = `${next.time} vaktine kalan süre`;
      }

      if (lastRenderedActiveName !== next.name) {
        renderTodayTimes();
      }
    }

    async function keepScreenAwake() {
      try {
        if ("wakeLock" in navigator) {
          await navigator.wakeLock.request("screen");
        }
      } catch (e) {}
    }

    loadPrayerTimes();
    keepScreenAwake();

    setInterval(updateScreen, 1000);

    // Gece 00:05 civarı yeni gün vakitlerini yeniden çek.
    setInterval(() => {
      const now = new Date();

      if (now.getHours() === 0 && now.getMinutes() === 5) {
        loadPrayerTimes();
      }
    }, 60 * 1000);
  </script>
</body>
</html>
